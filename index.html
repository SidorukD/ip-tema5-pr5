<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Визитки</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-lg-5 col-md-7 mx-auto">
                <h1 class="text-center mb-4">Расчёт стоимости визиток</h1>

                <div class="card">
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="count" class="form-label">Тираж</label>
                            <input type="number" id="count" class="form-control" value="90" min="30" step="30">
                        </div>

                        <div class="mb-3">
                            <label for="typePaper" class="form-label">Бумага</label>
                            <select id="typePaper" class="form-select"></select>
                        </div>

                        <div class="mb-3">
                            <label for="typeColor" class="form-label">Цветность</label>
                            <select id="typeColor" class="form-select"></select>
                        </div>

                        <p class="fs-3 mt-4 mb-0">
                            Итого: <b id="total">0</b> ₽
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="my.js"></script>
</body>
</html>
